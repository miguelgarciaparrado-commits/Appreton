<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Appreton</title>

  <!-- Fondo redondeado con gradiente marron -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A67C1A"/>
      <stop offset="100%" stop-color="#6B4E0A"/>
    </linearGradient>
    <linearGradient id="poopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5D3A1A"/>
    </linearGradient>
    <radialGradient id="poopShine" cx="35%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo cuadrado con esquinas redondeadas -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#bgGrad)"/>

  <!-- Mancha decorativa de fondo muy sutil -->
  <circle cx="820" cy="180" r="140" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="180" cy="900" r="120" fill="#FFFFFF" fill-opacity="0.04"/>

  <!-- Grupo del emoji de caca estilizado -->
  <g transform="translate(512, 380)" filter="url(#dropShadow)">
    <!-- Capa inferior (mas ancha) -->
    <ellipse cx="0" cy="110" rx="200" ry="80" fill="url(#poopGrad)"/>
    <!-- Capa media -->
    <ellipse cx="-15" cy="30" rx="165" ry="70" fill="url(#poopGrad)"/>
    <!-- Capa superior (la puntita) -->
    <ellipse cx="10" cy="-50" rx="115" ry="55" fill="url(#poopGrad)"/>
    <!-- Remate superior redondeado -->
    <circle cx="30" cy="-95" r="50" fill="url(#poopGrad)"/>

    <!-- Brillo sobre la caca -->
    <ellipse cx="-30" cy="-40" rx="140" ry="100" fill="url(#poopShine)"/>

    <!-- Ojos -->
    <circle cx="-55" cy="5" r="22" fill="#FFFFFF"/>
    <circle cx="55" cy="5" r="22" fill="#FFFFFF"/>
    <circle cx="-55" cy="5" r="12" fill="#1A1A1A"/>
    <circle cx="55" cy="5" r="12" fill="#1A1A1A"/>
    <!-- Reflejo de los ojos -->
    <circle cx="-50" cy="0" r="4" fill="#FFFFFF"/>
    <circle cx="60" cy="0" r="4" fill="#FFFFFF"/>

    <!-- Sonrisa -->
    <path d="M -50 70 Q 0 110 50 70" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Nombre APPRETON -->
  <g transform="translate(512, 780)">
    <text text-anchor="middle"
          font-family="'Impact', 'Arial Black', sans-serif"
          font-weight="900"
          font-size="155"
          letter-spacing="4"
          fill="#F5DEB3">APPRETON</text>
    <!-- Linea decorativa bajo el texto -->
    <rect x="-300" y="38" width="600" height="8" rx="4" fill="#F5DEB3" opacity="0.7"/>
  </g>

  <!-- Tagline pequeno -->
  <text x="512" y="900"
        text-anchor="middle"
        font-family="'Arial', sans-serif"
        font-weight="600"
        font-size="38"
        letter-spacing="2"
        fill="#F5DEB3"
        opacity="0.9">Te cagas? abreme</text>
</svg>
