<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>APPreton</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A67C1A"/>
      <stop offset="100%" stop-color="#6B4E0A"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="8" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo redondeado con gradiente marron -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#bgGrad)"/>

  <!-- Decoracion tenue -->
  <circle cx="820" cy="180" r="140" fill="#FFFFFF" fill-opacity="0.07"/>
  <circle cx="180" cy="900" r="120" fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- Texto principal APPreton -->
  <text x="512" y="520"
        text-anchor="middle"
        font-family="'Impact', 'Arial Black', 'DejaVu Sans', sans-serif"
        font-weight="900"
        font-size="210"
        letter-spacing="2"
        fill="#F5DEB3"
        filter="url(#textShadow)">APPreton</text>

  <!-- Linea decorativa -->
  <rect x="242" y="555" width="540" height="10" rx="5" fill="#F5DEB3" fill-opacity="0.8"/>

  <!-- Tagline -->
  <text x="512" y="630"
        text-anchor="middle"
        font-family="'Arial', 'DejaVu Sans', sans-serif"
        font-weight="600"
        font-size="52"
        letter-spacing="1"
        fill="#F5DEB3"
        fill-opacity="0.9">Te cagas? abreme</text>
</svg>
